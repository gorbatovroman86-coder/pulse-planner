name: Ночная копия данных

on:
  schedule:
    # 20:00 UTC = 03:00 по Новосибирску
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Забрать приватный репозиторий данных
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pulse-planner-data
          # Персональный токен владельца, а не GITHUB_TOKEN: иначе GitHub
          # не засчитывает активность и через 60 дней глушит расписание.
          token: ${{ secrets.BACKUP_PAT }}
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Снять срез
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs data/backups

      - name: Закоммитить копию
        working-directory: data
        run: |
          git config user.name  "pulse-backup"
          git config user.email "pulse-backup@users.noreply.github.com"
          git add backups
          if git diff --staged --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "Копия за $(date -u +%Y-%m-%d)"
            git push
          fi
