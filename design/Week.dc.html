<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0F5F4F; } a:hover { color: #0C4E41; }
    .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .card { background: #FFFFFF; border: 1px solid #E2E7EB; border-radius: 12px; box-shadow: 0 1px 2px rgba(17,24,32,.04), 0 10px 28px -16px rgba(17,24,32,.16); }
    .btn { padding: 5px 11px; border: 1px solid #E2E7EB; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: #57626E; background: #fff; }
  </style>
</helmet>

<div style="width: 1440px; height: 860px; background: #EEF1F3; color: #111820; font-family: 'Geologica', ui-sans-serif, sans-serif; font-size: 14.5px; padding: 24px 32px; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 16px; padding-bottom: 16px;">
    <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em;">
      <span class="num">07.09</span><span style="font-weight: 400; color: #AEB8C2;"> — </span><span class="num">13.09</span>
    </span>
    <span style="display: flex; gap: 6px;">
      <span class="btn">← Пред.</span>
      <span class="btn">Текущая</span>
      <span class="btn">След. →</span>
    </span>
  </div>

  <!-- Дни -->
  <div class="card" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); overflow: hidden;">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div style="min-height: 220px; padding: 12px 10px; background: {{d.bg}}; border-left: {{d.border}};">
        <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 6px;">
          <span style="font-size: 13px; font-weight: 500; color: {{d.ink}};">{{d.name}}</span>
          <span class="num" style="font-size: 12px; color: {{d.dateInk}};">{{d.date}}</span>
        </div>
        <sc-for list="{{d.tasks}}" as="t" hint-placeholder-count="2">
          <div style="display: flex; align-items: flex-start; gap: 8px; padding: 7px 0;">
            <span style="width: 17px; height: 17px; border: 1.5px solid #AEB8C2; border-radius: 999px; flex-shrink: 0;"></span>
            <span style="width: 7px; height: 7px; margin-top: 5px; border-radius: 999px; flex-shrink: 0; background: {{t.color}};"></span>
            <span style="flex-grow: 1; font-size: 13px; line-height: 1.35;">{{t.title}}</span>
          </div>
        </sc-for>
        <sc-if value="{{d.sum}}" hint-placeholder-val="{{ true }}">
          <div class="num" style="padding-top: 6px; text-align: right; font-size: 11.5px; color: #8A95A1;">{{d.sum}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- Внимание за неделю -->
  <div class="card" style="margin-top: 20px; overflow: hidden;">
    <div style="display: flex; align-items: center; padding: 16px 20px 8px;">
      <span style="font-size: 13px; font-weight: 500; color: #57626E;">Куда ушло внимание за неделю</span>
      <span style="flex-grow: 1;"></span>
      <span class="num" style="font-size: 13.5px; font-weight: 500;">14,5 ч</span>
    </div>
    <div style="padding: 0 20px 16px;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: 3px minmax(160px, 230px) 1fr 84px; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #EDF0F3;">
          <span style="width: 3px; height: 16px; border-radius: 999px; background: {{r.color}};"></span>
          <span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</span>
          <span style="position: relative; display: flex; align-items: center; height: 10px; border-radius: 999px; background: #EDF0F3;">
            <span style="position: absolute; top: 0; bottom: 0; left: 0; width: {{r.width}}; border-radius: 999px; background: {{r.color}};"></span>
            <span style="position: absolute; top: -3px; bottom: -3px; left: {{r.budget}}; width: 2px; border-radius: 999px; background: #AEB8C2;"></span>
          </span>
          <span class="num" style="text-align: right; font-size: 13.5px; color: {{r.ink}};">{{r.hours}}<span style="color: #AEB8C2;"> · {{r.count}}</span></span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const max = 8 * 60
    const row = (name, color, minutes, budget, count) => ({
      name, color, count,
      width: Math.max(minutes ? 2 : 0, (minutes / max) * 100) + '%',
      budget: ((budget * 60) / max) * 100 + '%',
      hours: minutes ? (Math.round((minutes / 60) * 10) / 10).toString().replace('.', ',') + ' ч' : '—',
      ink: minutes ? '#111820' : '#AEB8C2',
    })
    const day = (name, date, kind, tasks, sum) => ({
      name, date, tasks, sum,
      bg: kind === 'today' ? '#E6F0ED' : kind === 'weekend' ? '#F6F8F9' : '#FFFFFF',
      ink: kind === 'today' ? '#0F5F4F' : '#57626E',
      dateInk: kind === 'today' ? '#0F5F4F' : '#AEB8C2',
      border: name === 'пн' ? 'none' : '1px solid #EDF0F3',
    })
    return {
      days: [
        day('пн', '07.09', 'plain', [{ title: 'Свести капзатраты по площадкам', color: '#A8452F' }], '2 ч'),
        day('вт', '08.09', 'today', [{ title: 'Обновить районный баланс НСО', color: '#2A6E86' }, { title: 'Позвонить на элеватор', color: '#B57A1F' }], '2,3 ч'),
        day('ср', '09.09', 'plain', [{ title: 'Сверить остатки по Багану', color: '#B57A1F' }], '1 ч'),
        day('чт', '10.09', 'plain', [{ title: 'Баланс по Алтайскому краю', color: '#2A6E86' }], '2 ч'),
        day('пт', '11.09', 'plain', [{ title: 'Вычитать пункт по срокам поставки', color: '#3B5EA6' }], '0,8 ч'),
        day('сб', '12.09', 'weekend', [{ title: 'Сводка по экспортным ценам', color: '#6B4E9B' }], '0,5 ч'),
        day('вс', '13.09', 'weekend', [], ''),
      ],
      rows: [
        row('МЭЗ Карасук/Бийск', '#A8452F', 390, 8, 4),
        row('Агроаналитика Китай — РФ', '#2A6E86', 240, 6, 3),
        row('Кукуруза', '#B57A1F', 135, 5, 2),
        row('Пульт «Ядро + Масло»', '#6E7C22', 105, 6, 1),
        row('Договоры НПК', '#3B5EA6', 0, 3, 0),
        row('Мониторинг рынка', '#6B4E9B', 0, 3, 0),
        row('БДР (мотивация)', '#2E7D5B', 0, 4, 0),
      ],
    }
  }
}
</script>
</body>
</html>
