<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #14453C; } a:hover { color: #0C2C27; }
    .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #8A938E; }
  </style>
</helmet>

<div style="width: 1440px; height: 820px; background: #E5E8E4; color: #161C1A; font-family: 'Geologica', ui-sans-serif, sans-serif; font-weight: 350; font-size: 14px; padding: 24px; box-sizing: border-box;">

  <div style="display: flex; align-items: baseline; gap: 16px; padding-bottom: 12px;">
    <span style="font-size: 19px; font-weight: 300;">Неделя <span class="num">07.09</span><span style="color: #AEB6B1;"> — </span><span class="num">13.09</span></span>
    <span style="display: flex; gap: 4px;">
      <span class="eyebrow" style="border: 1px solid #CCD2CC; padding: 4px 8px;">← пред.</span>
      <span class="eyebrow" style="border: 1px solid #CCD2CC; padding: 4px 8px;">текущая</span>
      <span class="eyebrow" style="border: 1px solid #CCD2CC; padding: 4px 8px;">след. →</span>
    </span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: #CCD2CC;">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div style="min-height: 240px; padding: 0 8px 8px; background: {{d.bg}};">
        <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0; margin-bottom: 4px; border-bottom: 1px solid {{d.rule}};">
          <span class="eyebrow" style="color: {{d.ink}};">{{d.name}}</span>
          <span class="num" style="font-size: 11.5px; color: {{d.ink}};">{{d.date}}</span>
        </div>
        <sc-for list="{{d.tasks}}" as="t" hint-placeholder-count="2">
          <div style="display: flex; align-items: flex-start; gap: 8px; padding: 5px 0;">
            <span style="width: 13px; height: 13px; border: 1px solid #8A938E; flex-shrink: 0;"></span>
            <span style="width: 7px; height: 7px; margin-top: 3px; flex-shrink: 0; background: {{t.color}};"></span>
            <span style="flex-grow: 1; font-size: 12.5px; line-height: 1.3;">{{t.title}}</span>
          </div>
        </sc-for>
        <sc-if value="{{d.sum}}" hint-placeholder-val="{{ true }}">
          <div class="num" style="padding-top: 4px; text-align: right; font-size: 11px; color: #8A938E;">{{d.sum}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding-top: 32px;">
    <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 6px;">
      <span class="eyebrow">куда ушло внимание за неделю</span>
      <span style="flex-grow: 1; height: 1px; background: #CCD2CC;"></span>
      <span class="num" style="font-size: 12.5px;">14,5 ч</span>
    </div>
    <div style="height: 1px; background: #8A938E;"></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="display: grid; grid-template-columns: 3px minmax(160px, 240px) 1fr 88px; column-gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid #DCE0DA;">
        <span style="width: 3px; height: 14px; background: {{r.color}};"></span>
        <span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.name}}</span>
        <span style="position: relative; display: flex; align-items: center; height: 12px;">
          <span style="position: absolute; top: 1px; bottom: 1px; left: 0; width: {{r.width}}; background: {{r.color}};"></span>
          <span style="position: absolute; top: 0; bottom: 0; left: {{r.budget}}; width: 1px; background: #8A938E;"></span>
        </span>
        <span class="num" style="text-align: right; font-size: 12.5px; color: {{r.ink}};">{{r.hours}}<span style="color: #AEB6B1;"> · {{r.count}}</span></span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const max = 8 * 60
    const row = (name, color, minutes, budget, count) => ({
      name, color, count,
      width: Math.max(minutes ? 1.5 : 0, (minutes / max) * 100) + '%',
      budget: ((budget * 60) / max) * 100 + '%',
      hours: minutes ? (Math.round((minutes / 60) * 10) / 10).toString().replace('.', ',') + ' ч' : '—',
      ink: minutes ? '#161C1A' : '#AEB6B1',
    })
    const day = (name, date, bg, ink, rule, tasks, sum) => ({ name, date, bg, ink, rule, tasks, sum })
    return {
      days: [
        day('пн', '07.09', '#F2F4F1', '#8A938E', '#DCE0DA', [{ title: 'Свести капзатраты по площадкам', color: '#A8452F' }], '2 ч'),
        day('вт', '08.09', '#F2F4F1', '#161C1A', '#161C1A', [{ title: 'Обновить районный баланс НСО', color: '#2A6E86' }, { title: 'Позвонить на элеватор', color: '#B57A1F' }], '2,3 ч'),
        day('ср', '09.09', '#F2F4F1', '#8A938E', '#DCE0DA', [{ title: 'Сверить остатки по Багану', color: '#B57A1F' }], '1 ч'),
        day('чт', '10.09', '#F2F4F1', '#8A938E', '#DCE0DA', [{ title: 'Баланс по Алтайскому краю', color: '#2A6E86' }], '2 ч'),
        day('пт', '11.09', '#F2F4F1', '#8A938E', '#DCE0DA', [{ title: 'Вычитать пункт по срокам поставки', color: '#3B5EA6' }], '0,8 ч'),
        day('сб', '12.09', '#DDE1DC', '#8A938E', '#DCE0DA', [{ title: 'Сводка по экспортным ценам', color: '#6B4E9B' }], '0,5 ч'),
        day('вс', '13.09', '#DDE1DC', '#8A938E', '#DCE0DA', [], ''),
      ],
      rows: [
        row('МЭЗ Карасук/Бийск', '#A8452F', 390, 8, 4),
        row('Агроаналитика Китай — РФ', '#2A6E86', 240, 6, 3),
        row('Кукуруза', '#B57A1F', 135, 5, 2),
        row('Пульт «Ядро + Масло»', '#6E7C22', 105, 6, 1),
        row('Договоры НПК', '#3B5EA6', 0, 3, 0),
        row('Мониторинг рынка', '#6B4E9B', 0, 3, 0),
        row('БДР (мотивация)', '#2E7D5B', 0, 4, 0),
      ],
    }
  }
}
</script>
</body>
</html>
